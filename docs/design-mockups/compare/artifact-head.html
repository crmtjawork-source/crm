<title>Invested CRM — השוואת עיצוב</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: a quiet control bar over a grid of two scaled live stages (Apple | Swiss Teal), light and dark. */
:root{--bg:#F3F4F2;--fg:#15201F;--mut:#5D6B69;--card:#fff;--line:#DDE3E1;--acc:#0F766E;--accfg:#fff;--chip:#E8EDEB}

:root[data-theme="dark"]{--bg:#0E1413;--fg:#E8F0EE;--mut:#92A5A2;--card:#151D1C;--line:#26322F;--acc:#2DD4BF;--accfg:#04201C;--chip:#1C2725;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Heebo,system-ui,sans-serif;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1560px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
h1.t{font-size:26px;margin:0 0 4px;font-weight:700;letter-spacing:-.3px;text-wrap:balance}
.s{color:var(--mut);margin:0;font-size:14px;max-width:62ch}
.ctl{display:flex;flex-wrap:wrap;gap:12px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:13.5px;font-weight:500;border:0;background:transparent;color:var(--mut);padding:7px 14px;border-radius:8px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:focus-visible,.fs-btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 18px}
.grid.rowlab{gap:14px 18px}
.rowname{grid-column:1/-1;font-size:13px;font-weight:600;color:var(--mut);letter-spacing:.3px;margin-top:6px}
.panel{min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:14px;font-weight:600}
.ph small{color:var(--mut);font-weight:500;margin-inline-start:8px}
.fs-btn{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:5px 11px;cursor:pointer}
.fit{position:relative;width:100%;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:none;padding:20px;overflow:auto}
.ov.on{display:block}
.ov .box{max-width:1500px;margin:0 auto}
.ov .bar{display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:10px;font-weight:600}
.ov .fit{background:#000}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.fit{transition:opacity .15s}}

/* ---------- stage (1440x900 live mock) ---------- */
.stage{width:1440px;height:900px;position:absolute;top:0;right:0;transform-origin:top right;overflow:hidden;font-family:Heebo,sans-serif;font-size:14px;direction:rtl;color:var(--ink)}
.stage *{box-sizing:border-box;margin:0}
.win{display:flex}.side{display:flex;flex-direction:column;gap:2px}.main{flex:1;min-width:0;overflow:hidden}
.n{display:flex;align-items:center;gap:9px}.n span.row{display:flex;gap:9px;align-items:center}
.ic{display:grid;place-items:center}
.tb,.links,.f,.sr{display:flex}
.board{display:flex;gap:12px;overflow:hidden}.col{width:256px;flex:none;display:flex;flex-direction:column;gap:8px}
.lg{display:grid;grid-template-columns:minmax(0,640px) 1fr;gap:28px}
.sg{display:grid;grid-template-columns:210px 1fr;gap:28px}
table{width:100%;border-collapse:collapse}th,td{text-align:start}
.cb{display:inline-block}.mut{color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:600;color:color-mix(in srgb,var(--c) var(--pm),var(--pb));background:color-mix(in srgb,var(--c) 15%,var(--card))}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.tag{background:var(--fill);margin-inline-end:4px}

/* ====== Apple ====== */

.ap .n{padding:6px 10px;border-radius:8px;font-size:13.5px;font-weight:500}.ap .n.on{background:var(--seln)}

.ap table{font-size:13.5px}.ap th{color:var(--mut);font-weight:600;font-size:12px;padding:11px 16px;background:var(--th)}.ap td{padding:11px 16px;border-top:.5px solid var(--sep)}.ap tr.am td{background:var(--amber)}
.ap .cb{width:16px;height:16px;border:1.5px solid var(--cbb);border-radius:50%}.ap .cb.on{background:var(--tint);border-color:var(--tint);box-shadow:inset 0 0 0 3px var(--card)}
.ap .pill{border-radius:20px;padding:3px 10px;font-size:12.5px}.ap .lname{font-weight:600}
.ap .tag{font-size:12px;border-radius:20px;padding:2px 9px}

.ap .card{background:var(--card);border-radius:11px;padding:11px 12px;font-size:13.5px;box-shadow:var(--shadow);position:relative}.ap .card::before{content:"";position:absolute;inset-inline-start:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--c)}.ap .card b{font-weight:600;display:block}.ap .card .v{font-size:12.5px;color:var(--mut);margin-top:3px}.ap .card .pill{margin-top:7px}.ap .card .ow{font-size:12px;color:var(--mut);margin-top:7px}
